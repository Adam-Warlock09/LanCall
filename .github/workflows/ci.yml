# CI (phase 8): build the whole tree and run every test on Linux and on Windows (MSYS2
# UCRT64, the same GCC as on Linux) on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libopencv-dev \
            portaudio19-dev libsodium-dev libglfw3-dev
      - name: Build
        run: |
          cmake -S . -B build
          cmake --build build -j4
          test -f build/gui/lancall_gui
      # one test at a time: a few tests check timing, and running eight at once on a
      # 4-core runner can starve them (the audio stress test, for one)
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p opencv:p portaudio:p libsodium:p glfw:p
      - name: Configure
        run: cmake -S . -B build -G Ninja
      # lancall_gui is skipped, not failed, when GLFW is missing: check it was really built
      - name: Build
        run: |
          cmake --build build
          test -f build/gui/lancall_gui.exe
      - name: Test
        run: ctest --test-dir build/tests --output-on-failure
